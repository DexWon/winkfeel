# 자기관리해요 Android 빌드
# - 손으로 실행(Actions 탭 → Run workflow)하거나 app/ · workout/ 변경 시 자동 실행
# - 업로드 키 비밀값(ANDROID_KEYSTORE_BASE64 등)이 있으면 서명된 AAB(플레이스토어 업로드용)를,
#   없으면 서명 안 된 빌드와 테스트용 디버그 APK만 만든다.
name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'workout/**'
      - 'app/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::업로드 키 비밀값이 없어 서명 안 된 빌드만 만듭니다."
          fi

      - name: Build
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jagigwanri-${{ github.run_number }}
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
